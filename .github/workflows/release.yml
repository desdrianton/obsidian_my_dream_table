name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Both are needed to sign the attestation that ties the assets to this build.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Obsidian downloads the release whose tag equals the manifest version.
      - name: Check the tag matches manifest.json
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match manifest version $manifest" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      # Lets anyone verify the assets came from this repo, with:
      #   gh attestation verify main.js --repo <owner>/<repo>
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
